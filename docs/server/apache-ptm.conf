# Alternative to Nginx: Apache 2.4 + PHP 8.4-FPM, one virtual host per app.
# Both apps ship public/.htaccess (Laravel default), so AllowOverride All is enough for clean URLs.
# Not exercised in the server test (docs/evidence/tests/server-install.txt covers Nginx); the settings are the standard Laravel ones.
# Install:
#   sudo a2enmod rewrite headers proxy_fcgi setenvif
#   sudo a2enconf php8.4-fpm
#   sudo cp docs/server/apache-ptm.conf /etc/apache2/sites-available/ptm.conf
#   sudo a2ensite ptm && sudo apache2ctl configtest && sudo systemctl reload apache2
# Replace the domains and the folder as in nginx-ptm.conf.

<VirtualHost *:80>
    ServerName admin.example.com
    DocumentRoot /var/www/project-team-management/admin-app/public
    <Directory /var/www/project-team-management/admin-app/public>
        AllowOverride All
        Require all granted
    </Directory>
    LimitRequestBody 16777216
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog ${APACHE_LOG_DIR}/ptm-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/ptm-admin-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName team.example.com
    DocumentRoot /var/www/project-team-management/team-app/public
    <Directory /var/www/project-team-management/team-app/public>
        AllowOverride All
        Require all granted
    </Directory>
    LimitRequestBody 16777216
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog ${APACHE_LOG_DIR}/ptm-team-error.log
    CustomLog ${APACHE_LOG_DIR}/ptm-team-access.log combined
</VirtualHost>
