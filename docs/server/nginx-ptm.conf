# Project & Team Management on one Linux server: Nginx + PHP 8.4-FPM, one site per app.
# Based on the Nginx example in the Laravel 13 deployment documentation (https://laravel.com/docs/13.x/deployment#nginx).
# Before use, replace:
#   admin.example.com, team.example.com      your two (sub)domains
#   /var/www/project-team-management         the folder where the zip was extracted
#   unix:/run/php/php8.4-fpm.sock            the PHP-FPM socket on your server (ls /run/php/)
# Install:
#   sudo cp docs/server/nginx-ptm.conf /etc/nginx/sites-available/ptm.conf
#   sudo ln -s /etc/nginx/sites-available/ptm.conf /etc/nginx/sites-enabled/ptm.conf
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS afterwards: sudo certbot --nginx -d admin.example.com -d team.example.com

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;
    root /var/www/project-team-management/admin-app/public;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;
    charset utf-8;

    # Task results may carry a file of up to 10 MB (SubmissionRequest); keep in step with docs/server/php-ptm.ini.
    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite assets have a content hash in their file name, so browsers may keep them for a year.
    location /build/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name team.example.com;
    root /var/www/project-team-management/team-app/public;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.php;
