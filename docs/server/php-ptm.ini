; PHP settings for Project & Team Management (both apps).
; Task results may carry a file of up to 10 MB and profile photos up to 2 MB; PHP's defaults (2M / 8M) are too small.
; Install on Ubuntu/Debian with PHP 8.4-FPM:
;   sudo cp docs/server/php-ptm.ini /etc/php/8.4/fpm/conf.d/99-ptm.ini
;   sudo systemctl restart php8.4-fpm
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 60
