# MySQL 8.4 (meets the guide's MySQL 8.0+) and phpMyAdmin for the one-time SQL import (guide 2.3 step 5).
# Passwords are read from .env in this folder (not committed); without it the local defaults below are used, matching
# the value php artisan ptm:setup writes to admin-app/.env. The port is bound to 127.0.0.1 only. Data lives in the volume ptm_mysql.
services:
  mysql:
    image: mysql:8.4
    container_name: ptm_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ptm-root-local}
      MYSQL_DATABASE: project_team_management
      MYSQL_USER: ptm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ptm-local}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:33061:3306"
    volumes:
      - ptm_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-ptm-root-local}"]
      interval: 5s
      retries: 30
  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: ptm_phpmyadmin
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8180:80"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  ptm_mysql:
